[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cheeseball"
version = "0.1.0"
description = "命令行 AI 助手，支持多 LLM 后端流式对话"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "textual>=0.40.0",
    "httpx>=0.25.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
cheeseball = "cheeseball.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["cheeseball*"]
